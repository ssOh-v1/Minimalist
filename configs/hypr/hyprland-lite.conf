env = HYPRCURSOR_THEME,Simp1e
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Simp1e
env = XCURSOR_SIZE,24

# Zero-Drag Hyprland Configuration
# Strictly matched to FINAL_CONFIG.md

# Monitor configuration
monitor=,preferred,auto,1

# Execute apps at launch
exec-once = ~/.config/hypr/scripts/layout-notify.sh &
exec-once = waybar 
exec-once = swaync
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = ~/.local/bin/restore-wallpaper.sh
exec-once = hypridle
exec-once = batsignal -w 15 -c 5 -d 2 -p

# Clipboard History
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Environment variables
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct

# Input configuration
input {
    kb_layout = us, ru
    numlock_by_default = false
    follow_mouse = 1
    touchpad {
	disable_while_typing = false
        natural_scroll = false
	tap-to-click = false
	drag_lock = false
     }
    sensitivity = 0
}

# General settings
general {
    gaps_in = 3
    gaps_out = 6
    border_size = 1
    col.active_border = rgba(b4befeff)
    col.inactive_border = rgba(6c7086ff)
    layout = dwindle
    allow_tearing = false
}

# Decoration - Minimal/Performance
decoration {
    rounding = 0
    
    blur {
        enabled = false
    }

    # NEW SYNTAX: Shadow is now its own block
    shadow {
        enabled = false
    }
}

# Animations - Ultra-fast and low-latency only
animations {
    enabled = false

    # 1ds = 100ms. Keep motion nearly instant to avoid a floaty feel.
    bezier = snap, 0.12, 0.96, 0.18, 1.0

    animation = windows, 1, 1, snap, slide
    animation = windowsIn, 1, 1, snap, slide
    animation = windowsOut, 1, 1, snap, slide
    animation = windowsMove, 1, 1, snap

    animation = workspaces, 1, 1, snap, slidefade 10%
    animation = specialWorkspace, 1, 1, snap, slidefade 10%

    animation = fade, 0
    animation = border, 0
    animation = borderangle, 0
}

# Включаем анимацию для слоёв (включая обои)
animation = fadeLayers, 1, 7, default

# Отключаем логотип Hyprland и дефолтные обои, чтобы они не мешали
misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    background_color = 0x1a1a1a
    on_focus_under_fullscreen = 2
}

# Dwindle layout
dwindle {
    preserve_split = true
}

# Master layout
master {
    new_status = master
}

# Gestures - Disabled
# gestures {
#     workspace_swipe = false
# }

# Misc settings


# Debug settings
debug {
    vfr = true
}

# Keybindings
$mainMod = SUPER
bind = $mainMod, Return, exec, kitty
bind = $mainMod, E, exec, nemo
bind = $mainMod, R, exec, fuzzel
bind = SUPER, B, exec, firefox
bind = SUPER, S, exec, steam
bind = SUPER, D, exec, discord
bind = SUPER, P, exec, spotify-launcher
bind = SUPER, T, exec, Telegram
bind = CTRL, S, exec, ~/.config/hypr/scripts/toggle-spotify-panel.sh

# Window Switcher (Cycling Workspaces)
# Super+Tab now cycles through workspaces
bind = $mainMod, Tab, workspace, m+1

# Window Switcher (Fuzzel)
# Alt+Tab uses custom script to switch windows
bind = ALT, Tab, exec, ~/.config/hypr/scripts/window_switcher.sh

bind = $mainMod, Q, killactive,
bind = $mainMod, F, fullscreen,
bind = $mainMod, N, exec, killall -SIGUSR1 waybar
bind = $mainMod, M, exit, 

# Mouse Bindings
bindm = $mainMod, mouse:272, movewindow   # Left Mouse Button
bindm = $mainMod, mouse:273, resizewindow # Right Mouse Button

# Keyboard Window Move (Ctrl + Alt + Arrow)
bind = CTRL ALT, left, movewindow, l
bind = CTRL ALT, right, movewindow, r
bind = CTRL ALT, up, movewindow, u
bind = CTRL ALT, down, movewindow, d
# Делаем окно плавающим (как в KooL, где есть Super+Shift+F)
bind = SUPER, Space, togglefloating, active

# Закрепляем его поверх других (pin)
bind = SUPER SHIFT, Space, pin, active

# Keyboard Window Resize (Super + Alt + Arrow)
binde = $mainMod ALT, right, resizeactive, 10 0
binde = $mainMod ALT, left, resizeactive, -10 0
binde = $mainMod ALT, up, resizeactive, 0 -10
binde = $mainMod ALT, down, resizeactive, 0 10

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Move focus (Vim Style + Arrow Keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Multimedia Keys
binde = , XF86AudioRaiseVolume, exec, pamixer -i 5
binde = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t
binde = , XF86MonBrightnessUp, exec, brightnessctl s +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# Wallpaper switching
bind = SUPER, W, exec, ~/.local/bin/change-wallpaper.sh

# Utilities (Clipboard, Screenshot, Lock)
bind = SUPER, V, exec, cliphist list | rofi -dmenu -display-columns 2 -p "📋 Буфер обмена" -theme ~/.config/rofi/clipboard.rasi | cliphist decode | wl-copy
bind = $mainMod SHIFT, C, exec, hyprpicker -a
bind = $mainMod, L, exec, hyprlock
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh
bind = $mainMod, X, exec, ~/.config/hypr/scripts/theme-menu.sh
bind = $mainMod ALT, B, exec, ~/.config/hypr/scripts/waybar-theme-picker.sh

# Удаление одного элемента из буфера
bind = CTRL, Delete, exec, ~/.config/hypr/scripts/clipboard-delete.sh

# Полная очистка буфера
bind = ALT, Delete, exec, ~/.config/hypr/scripts/clipboard-clear.sh

# Не перекрывать Waybar
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.5, match:namespace waybar

# Правила для Spotify Panel
layerrule = animation slide left, match:namespace ^(spotify-panel)$
layerrule = blur on, match:namespace ^(spotify-panel)$
layerrule = ignore_alpha 0.5, match:namespace ^(spotify-panel)$

device {
    name = ELAN0420:00 04F3:3240 Touchpad
    enabled = false
}

device {
    name = ETPS/2 Elantech Touchpad
    enabled = false
}



# Zero-Drag Hyprlock Config
# Minimal, Performance-Oriented, Catppuccin Mocha

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    animation = fade,    1, 6, default
    animation = fadeIn,  1, 6, default
    animation = fadeOut, 1, 6, default
}

background {
    monitor =
    path = /home/ssoh/Pictures/wallpapers/my_wallpaper.png
    color = rgba(30, 30, 46, 1.0) # Catppuccin Base
    
    # Frosted glass blur for macOS aesthetics
    blur_passes = 3
    blur_size = 8
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(180, 190, 254, 1.0) # Lavender
    font_size = 80
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, -100
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(186, 194, 222, 1.0) # Subtext1
    font_size = 24
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, -220
    halign = center
    valign = top
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(180, 190, 254, 1.0) # Lavender
    inner_color = rgba(30, 30, 46, 1.0) # Base
    font_color = rgba(205, 214, 244, 1.0) # Text
    fade_on_empty = true
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    position = 0, 0
    halign = center
    valign = center
}

# MUSIC WIDGET BACKGROUND
shape {
    monitor =
    color = rgba(100, 114, 125, 0.4)
    size = 500, 140
    rounding = 25
    shadow_passes = 2
    shadow_size = 4
    position = 0, 40
    halign = center
    valign = bottom
    zindex = 0
}

# MEDIA ALBUM ART
image {
    monitor =
    path = $HOME/.cache/hyprlock-art/current.jpg
    size = 100
    rounding = 12
    border_size = 2
    border_color = rgba(180, 190, 254, 1.0) # Lavender
    shadow_passes = 2
    shadow_size = 3
    position = -165, 57
    halign = center
    valign = bottom
    reload_time = 2
    reload_cmd = ~/.config/hypr/scripts/hyprlock-music.sh --art
    zindex = 1
}

# SONG TITLE
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/hyprlock-music.sh --title)"
    color = rgba(205, 214, 244, 1.0) # Text
    font_size = 18
    font_family = JetBrains Mono Nerd Font Bold
    position = 55, 138
    halign = center
    valign = bottom
    zindex = 1
}

# ARTIST
label {
    monitor =
    text = cmd[update:1000] echo "󰠃  $(~/.config/hypr/scripts/hyprlock-music.sh --artist)"
    color = rgba(166, 173, 200, 1.0) # Subtext0
    font_size = 12
    font_family = JetBrains Mono Nerd Font Bold
    position = 55, 118
    halign = center
    valign = bottom
    zindex = 1
}

# PLAYER SOURCE
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/hyprlock-music.sh --player)"
    color = rgba(186, 194, 222, 1.0) # Subtext1
    font_size = 11
    font_family = JetBrains Mono Nerd Font Bold
    position = 195, 45
    halign = center
    valign = bottom
    zindex = 1
}

# PREV TRACK
label {
    monitor =
    text = 󰒮
    color = rgba(180, 190, 254, 1.0) # Lavender
    font_size = 20
    onclick = playerctl previous
    position = 0, 55
    halign = center
    valign = bottom
}

# PLAY / PAUSE
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/hyprlock-music.sh --status
    color = rgba(180, 190, 254, 1.0) # Lavender
    font_size = 28
    onclick = playerctl play-pause
    position = 55, 55
    halign = center
    valign = bottom
}

# NEXT TRACK
label {
    monitor =
    text = 󰒭
    color = rgba(180, 190, 254, 1.0) # Lavender
    font_size = 20
    onclick = playerctl next
    position = 110, 55
    halign = center
    valign = bottom
}

# CURRENT POSITION
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/hyprlock-music.sh --position)"
    color = rgba(186, 194, 222, 0.80) # Subtext1
    font_size = 10
    font_family = JetBrains Mono Nerd Font Bold
    position = -100, 95
    halign = center
    valign = bottom
}

# TRACK LENGTH
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/hyprlock-music.sh --length)"
    color = rgba(186, 194, 222, 0.80) # Subtext1
    font_size = 10
    font_family = JetBrains Mono Nerd Font Bold
    position = 205, 95
    halign = center
    valign = bottom
}

# PROGRESS BAR
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/hyprlock-music.sh --progress-bar
    color = rgba(205, 214, 244, 0.80) # Text
    font_size = 12
    font_family = JetBrains Mono Nerd Font Bold
    position = 55, 95
    halign = center
    valign = bottom
}
